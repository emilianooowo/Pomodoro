<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Forma estándar del icono de macOS -->
    <clipPath id="macOS">
      <rect width="1024" height="1024" rx="230" ry="230" />
    </clipPath>
    <!-- Corte del 70% de progreso -->
    <clipPath id="progressFill">
      <rect width="716.8" height="1024" />
    </clipPath>
  </defs>

  <!-- Cuerpo del Icono -->
  <g clip-path="url(#macOS)">
    
    <!-- FONDO 1: Blanco/Gris claro (El 30% restante) -->
    <rect width="1024" height="1024" fill="#F5F5F7" />
    <!-- Círculo Azul (Visible en la parte blanca) -->
    <circle cx="512" cy="512" r="240" fill="none" stroke="#0A84FF" stroke-width="45" stroke-dasharray="60 40" stroke-linecap="round" />

    <!-- FONDO 2: Azul de Progreso (El 70% lleno) -->
    <g clip-path="url(#progressFill)">
        <rect width="1024" height="1024" fill="#0A84FF" />
        <!-- Círculo Blanco (Visible en la parte azul) -->
        <circle cx="512" cy="512" r="240" fill="none" stroke="#FFFFFF" stroke-width="45" stroke-dasharray="60 40" stroke-linecap="round" />
    </g>
    
  </g>

  <!-- Sombras y brillos internos para el estilo cristal de macOS -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="4"/>
  <rect width="1024" height="1024" rx="230" ry="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8" transform="translate(0, -2)"/>
</svg>
